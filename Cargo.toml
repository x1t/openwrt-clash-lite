[package]
name = "openwrt-clash-lite"
version = "0.1.9"
edition = "2024"
license = "MIT"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
flate2 = "1.1.10"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# zig's linker driver prints "argument unused: -nostartfiles" for test binaries; it is about the
# toolchain, not our code, and would otherwise be reported as a warning on every cross build.
[lints.rust]
linker_messages = "allow"
