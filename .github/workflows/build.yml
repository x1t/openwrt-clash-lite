name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust targets
        run: rustup target add armv7-unknown-linux-musleabihf aarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Cross-compile
        run: |
          cargo zigbuild --release --target armv7-unknown-linux-musleabihf
          cargo zigbuild --release --target aarch64-unknown-linux-musl

      - name: Package ipk
        run: |
          bash scripts/build-ipk.sh "$VERSION" armv7 target/armv7-unknown-linux-musleabihf/release/openwrt-clash-lite dist
          bash scripts/build-ipk.sh "$VERSION" aarch64 target/aarch64-unknown-linux-musl/release/openwrt-clash-lite dist
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: dist/*.ipk

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ipk
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.ipk
          fail_on_unmatched_files: true
          generate_release_notes: true
